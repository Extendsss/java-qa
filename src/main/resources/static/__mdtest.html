<script type="text/plain" id="sample-content">## HashMap 的扩容机制

当元素数量超过 **负载因子 × 容量** 时触发扩容，核心流程如下：

```java
public class HashMapDemo {
    public static void main(String[] args) {
        Map<String, Integer> map = new HashMap<>(16);
        map.put("鸽鸽", 1);
        System.out.println(map.get("鸽鸽"));
    }
}
```

对应的建表语句：

```mysql
CREATE TABLE `question` (
  `id` BIGINT PRIMARY KEY AUTO_INCREMENT,
  `title` VARCHAR(200) NOT NULL COMMENT '题目标题',
  `analysis` TEXT COMMENT '解析'
) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
```

MyBatis 映射片段：

```xml
<mapper namespace="com.quiz.mapper.QuestionMapper">
    <select id="findById" resultType="Question">
        SELECT * FROM question WHERE id = #{id}
    </select>
</mapper>
```

接口返回示例：

```json
{"code": 0, "data": {"id": 1, "title": "HashMap 扩容机制"}}
```

行内代码 `HashMap.put()` 与 **加粗** 同样支持，列表亦可：

- 扩容阈值 = 容量 × 负载因子
- 扩容后旧元素 `rehash` 迁移</script>

<script type="text/plain" id="sample-answer">扩容时容量翻倍，旧数组元素重新散列到新数组：

```java
Node<K,V>[] newTab = (Node<K,V>[])new Node[newCap];
transfer(tab, newTab);
```

> 时间复杂度 O(n)，尽量预设初始容量避免多次扩容。</script>

<script type="text/plain" id="sample-analysis">1. `put` 后检查 `++size > threshold`
2. 触发 `resize()`，容量左移一位
3. 元素迁移后重新计算下标</script>
