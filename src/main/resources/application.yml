server:
  port: ${PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      force: true
spring:
  profiles:
    default: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  sql:
    init:
      mode: always
      encoding: UTF-8
  mvc:
    throw-exception-if-no-handler-found: true
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
sa-token:
  token-name: satoken
  timeout: 604800
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-read-cookie: false
  is-read-header: true
  is-read-body: false
  is-log: false
quiz:
  initial-admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}
